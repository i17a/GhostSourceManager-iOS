name: GhostSourceManager
options:
  bundleIdPrefix: com.ghostsource
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  GhostSourceManager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GhostSourceManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostsource.manager
        INFOPLIST_FILE: GhostSourceManager/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies: []

  GhostSourceManagerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GhostSourceManagerTests
    dependencies:
      - target: GhostSourceManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  GhostSourceManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GhostSourceManagerUITests
    dependencies:
      - target: GhostSourceManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
