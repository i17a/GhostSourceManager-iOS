name: Build SideSource iOS

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing Version (CFBundleShortVersionString)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Build Number (CFBundleVersion)"
        required: false
        default: "1"
      run_simulator_tests:
        description: "Run UI and unit tests on iPhone simulators"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build SideSource & Optional Signed IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Regenerate Xcode project with XcodeGen (if project.yml updated)
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate
          else
            brew install xcodegen
            xcodegen generate
          fi

      - name: Resolve version numbers
        id: ver
        run: |
          VERSION="${{ github.event.inputs.marketing_version }}"
          if [ -z "$VERSION" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              VERSION="1.0.0"
            fi
          fi
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUM}" >> "$GITHUB_OUTPUT"

      - name: Check whether Apple Code Signing Secrets are configured
        id: check_signing
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          PROVISION_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$P12_PASS" ] && [ -n "$PROVISION_B64" ] && [ -n "$KEYCHAIN_PASS" ] && [ -n "$TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::بيانات التوقيع غير مضافة في GitHub Secrets؛ سيُبنى التطبيق ويُحزم كملف SideSource.ipa غير موقّع للتوقيع الجانبي."
          fi

      - name: Import Code Signing Certificate & Provisioning Profile
        if: steps.check_signing.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Optional UI and Unit Tests on iPhone simulators
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_simulator_tests }}
        run: |
          DEVICE_MAP=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, subprocess
          payload = json.load(sys.stdin)
          devices = [d for group in payload["devices"].values() for d in group
                     if d.get("isAvailable", True) and d["name"].startswith("iPhone")]
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          ios = [r for r in runtimes if r.get("isAvailable") and "iOS" in r.get("name", "")]
          if not ios:
              raise SystemExit("No available iOS simulator runtime")
          runtime = sorted(ios, key=lambda r: tuple(int(x) for x in r.get("version", "0").split(".")))[-1]
          types_payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          types = types_payload.get("devicetypes", types_payload.get("deviceTypes", []))
          def ensure_device(name, predicate):
              existing = next((d for d in devices if predicate(d["name"])), None)
              if existing:
                  return existing
              dtype = next((d for d in types if predicate(d["name"])), None)
              if not dtype:
                  raise SystemExit("Simulator device type unavailable: " + name)
              udid = subprocess.check_output(["xcrun", "simctl", "create", name, dtype["identifier"], runtime["identifier"]], text=True).strip()
              return {"name": name, "udid": udid}
          iphone15 = ensure_device("iPhone 15 Pro", lambda n: n == "iPhone 15 Pro")
          iphoneSE = ensure_device("iPhone SE", lambda n: n.startswith("iPhone SE"))
          print("iPhone 15 Pro=" + iphone15["udid"])
          print("iPhone SE=" + iphoneSE["udid"])
          ')
          IPHONE_15_PRO=$(echo "$DEVICE_MAP" | sed -n 's/^iPhone 15 Pro=//p')
          IPHONE_SE=$(echo "$DEVICE_MAP" | sed -n 's/^iPhone SE=//p')
          for DEVICE in "iPhone 15 Pro:$IPHONE_15_PRO" "iPhone SE:$IPHONE_SE"; do
            DEVICE_NAME="${DEVICE%%:*}"
            SIM_ID="${DEVICE#*:}"
            echo "Running UI and unit tests on ${DEVICE_NAME} (${SIM_ID})"
            xcrun simctl boot "$SIM_ID" 2>/dev/null || true
            xcrun simctl bootstatus "$SIM_ID" -b
            xcodebuild test \
              -project GhostSourceManager.xcodeproj \
              -scheme GhostSourceManager \
              -destination "platform=iOS Simulator,id=${SIM_ID}" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData-${SIM_ID}" \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Archive & Export Signed IPA (when signing secrets exist)
        if: steps.check_signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          METHOD="${EXPORT_METHOD:-ad-hoc}"
          mkdir -p "$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild archive             -project GhostSourceManager.xcodeproj             -scheme GhostSourceManager             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/SideSource.xcarchive"             MARKETING_VERSION="${{ steps.ver.outputs.version }}"             CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}"             DEVELOPMENT_TEAM="${TEAM_ID}"

          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/SideSource.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/export"

          mv "$RUNNER_TEMP/export/GhostSourceManager.ipa"              "$RUNNER_TEMP/export/SideSource.ipa"

      - name: Upload Signed IPA Artifact
        if: steps.check_signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SideSource-Signed-IPA-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Build Unsigned IPA for Sideloading (when signing secrets are NOT configured)
        if: steps.check_signing.outputs.signed == 'false'
        run: |
          BUILD_DIR="$RUNNER_TEMP/unsigned-output"
          mkdir -p "$BUILD_DIR/Payload"
          xcodebuild build \
            -project GhostSourceManager.xcodeproj \
            -scheme GhostSourceManager \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          test -d "$BUILD_DIR/GhostSourceManager.app"
          cp -R "$BUILD_DIR/GhostSourceManager.app" "$BUILD_DIR/Payload/"
          (cd "$BUILD_DIR" && /usr/bin/zip -qry "$RUNNER_TEMP/SideSource.ipa" Payload)
          test -s "$RUNNER_TEMP/SideSource.ipa"
      - name: Upload Unsigned IPA Artifact
        if: steps.check_signing.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: SideSource-IPA-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}
          path: ${{ runner.temp }}/SideSource.ipa
          if-no-files-found: error
      - name: Clean Up Temporary Keychain
        if: always() && steps.check_signing.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
