name: Build Ghost Source Manager iOS

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing Version (CFBundleShortVersionString)"
        required: false
        default: "1.0.0"
      build_number:
        description: "Build Number (CFBundleVersion)"
        required: false
        default: "1"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Xcode Project & Optional Signed IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Regenerate Xcode project with XcodeGen (if project.yml updated)
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate
          else
            brew install xcodegen
            xcodegen generate
          fi

      - name: Resolve version numbers
        id: ver
        run: |
          VERSION="${{ github.event.inputs.marketing_version }}"
          if [ -z "$VERSION" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              VERSION="1.0.0"
            fi
          fi
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUM}" >> "$GITHUB_OUTPUT"

      - name: Check whether Apple Code Signing Secrets are configured
        id: check_signing
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          PROVISION_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$P12_PASS" ] && [ -n "$PROVISION_B64" ] && [ -n "$KEYCHAIN_PASS" ] && [ -n "$TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::بيانات التوقيع غير مضافة في GitHub Secrets؛ سيتم التحقق من بناء المشروع وإنتاج أرشيف غير موقّع (.xcarchive) فقط وليس ملف IPA موقّعاً قابلاً للتثبيت المباشر."
          fi

      - name: Import Code Signing Certificate & Provisioning Profile
        if: steps.check_signing.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Run Unit Tests on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          if [ -n "$SIM_ID" ]; then
            xcodebuild test               -project GhostSourceManager.xcodeproj               -scheme GhostSourceManager               -destination "platform=iOS Simulator,id=${SIM_ID}"               CODE_SIGNING_ALLOWED=NO
          fi

      - name: Archive & Export Signed IPA (when signing secrets exist)
        if: steps.check_signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.EXPORT_METHOD }}
        run: |
          METHOD="${EXPORT_METHOD:-ad-hoc}"
          mkdir -p "$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild archive             -project GhostSourceManager.xcodeproj             -scheme GhostSourceManager             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/GhostSourceManager.xcarchive"             MARKETING_VERSION="${{ steps.ver.outputs.version }}"             CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}"             DEVELOPMENT_TEAM="${TEAM_ID}"

          xcodebuild -exportArchive             -archivePath "$RUNNER_TEMP/GhostSourceManager.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -exportPath "$RUNNER_TEMP/export"

          mv "$RUNNER_TEMP/export/GhostSourceManager.ipa"              "$RUNNER_TEMP/export/GhostSourceManager-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}-signed.ipa"

      - name: Upload Signed IPA Artifact
        if: steps.check_signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GhostSourceManager-Signed-IPA-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Build Unsigned IPA for Sideloading (when signing secrets are NOT configured)
        if: steps.check_signing.outputs.signed == 'false'
        run: |
          BUILD_DIR="$RUNNER_TEMP/unsigned-output"
          mkdir -p "$BUILD_DIR/Payload"
          xcodebuild build \
            -project GhostSourceManager.xcodeproj \
            -scheme GhostSourceManager \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          test -d "$BUILD_DIR/GhostSourceManager.app"
          cp -R "$BUILD_DIR/GhostSourceManager.app" "$BUILD_DIR/Payload/"
          (cd "$BUILD_DIR" && /usr/bin/zip -qry "$RUNNER_TEMP/GhostSourceManager-unsigned.ipa" Payload)
          test -s "$RUNNER_TEMP/GhostSourceManager-unsigned.ipa"
      - name: Upload Unsigned IPA Artifact
        if: steps.check_signing.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: GhostSourceManager-unsigned-IPA-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}
          path: ${{ runner.temp }}/GhostSourceManager-unsigned.ipa
          if-no-files-found: error
      - name: Clean Up Temporary Keychain
        if: always() && steps.check_signing.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
